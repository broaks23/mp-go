plugins { id 'com.android.application' }

android {
    namespace 'app.mpgo'
    compileSdk 36
    defaultConfig {
        applicationId 'app.mpgo'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('MPGO_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MPGO_KEYSTORE_PATH'))
                storePassword System.getenv('MPGO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MPGO_KEY_ALIAS') ?: 'mpgo'
                keyPassword System.getenv('MPGO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
}
