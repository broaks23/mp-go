name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check Maven Central access
        run: curl --fail --silent --show-error --location --output /dev/null --write-out 'Maven Central HTTP %{http_code}\n' https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.1.20/kotlin-stdlib-2.1.20.pom
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --info
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpGo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk --title "MpGo $GITHUB_REF_NAME" --generate-notes
