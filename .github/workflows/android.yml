name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore signing key
        env:
          MPGO_KEYSTORE_BASE64: ${{ secrets.MPGO_KEYSTORE_BASE64 }}
        run: |
          test -n "$MPGO_KEYSTORE_BASE64"
          printf '%s' "$MPGO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mpgo.p12"
          echo "MPGO_KEYSTORE_PATH=$RUNNER_TEMP/mpgo.p12" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          MPGO_KEYSTORE_PASSWORD: ${{ secrets.MPGO_KEYSTORE_PASSWORD }}
          MPGO_KEY_PASSWORD: ${{ secrets.MPGO_KEY_PASSWORD }}
          MPGO_KEY_ALIAS: mpgo
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MpGo.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpGo-signed-apk
          path: MpGo.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MpGo.apk --title "MpGo $GITHUB_REF_NAME" --generate-notes
